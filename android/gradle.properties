## Reduced JVM memory for machines with limited RAM to avoid daemon OOM (was 8G)
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Limit parallel workers to reduce concurrent native memory usage
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true



